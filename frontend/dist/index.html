    <!-- Must run synchronously, before React (or anything else) loads, and
         before the browser applies its own automatic scroll-restoration
         for this history entry. Doing this inside a React useEffect is too
         late — the app has already mounted and painted by then, so the
         browser can briefly jump to a remembered scroll position (often
         showing the footer) right on load before React's own reset takes
         over. Setting it here removes that window entirely. -->
    <script>
      if ('scrollRestoration' in window.history) {
        window.history.scrollRestoration = 'manual';
      }
    </script>

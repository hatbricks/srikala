name: Continuous Deployment to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: SSH and execute deployment script (via Key)
        if: "${{ env.HAS_KEY != '' }}"
        env:
          HAS_KEY: ${{ secrets.VPS_SSH_KEY }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            bash /var/www/srikala/deploy.sh

      - name: SSH and execute deployment script (via Password)
        if: "${{ env.HAS_KEY == '' }}"
        env:
          HAS_KEY: ${{ secrets.VPS_SSH_KEY }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            bash /var/www/srikala/deploy.sh

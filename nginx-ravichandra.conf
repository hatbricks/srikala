# Nginx Configuration for Ravichandra Textiles (Direct VPS Hosting — No Vercel needed)
# Place this at: /etc/nginx/sites-available/ravichandra.conf
# Symlink to:    /etc/nginx/sites-enabled/ravichandra.conf

# 1. Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ravichandratextiles.com www.ravichandratextiles.com api.ravichandratextiles.com;

    return 301 https://$host$request_uri;
}

# 2. Main Storefront & Admin: ravichandratextiles.com & www.ravichandratextiles.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ravichandratextiles.com www.ravichandratextiles.com;

    # SSL Certificates (managed automatically by certbot)
    ssl_certificate /etc/letsencrypt/live/api.ravichandratextiles.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ravichandratextiles.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend compiled build root
    root /var/www/srikala/frontend/dist;
    index index.html;

    client_max_body_size 30m;

    # High-performance Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cache immutable static assets (JS, CSS, fonts)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Cache media assets (images & videos)
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /videos/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API Proxy to Express Backend (Port 4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Sitemap Proxy
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 3. Subdomain api.ravichandratextiles.com (backwards compatibility for webhooks & direct calls)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.ravichandratextiles.com;

    ssl_certificate /etc/letsencrypt/live/api.ravichandratextiles.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ravichandratextiles.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
